aid: aclima
name: Aclima
description: >-
  Aclima is a San Francisco-based environmental intelligence company that maps
  and analyzes air pollution and greenhouse gas emissions at hyperlocal,
  block-by-block resolution. Using a network of roving (vehicle-mounted) and
  stationary sensors, Aclima measures multiple pollutants and climate gases
  simultaneously at up to 100,000x greater resolution than traditional
  monitoring, then translates billions of scientific measurements into
  environmental intelligence for governments, companies, and communities.
  Its professional analytics software, Aclima Pro, delivers visualization and
  automated analytics for emissions reduction and public-health programs, while
  its free air.health app maps address-level air and climate insights for the
  communities Aclima serves. Co-founded by CEO Davida Herzl, Aclima is backed by
  DCVC and is added to the API Evangelist network for enrichment.
